name: Keep Render instance warm (every 14 min 24/7)

# Pings GET /api/v1/health every 14 minutes 24/7 so the Render free-tier container never spins down
# after 15 minutes of inactivity. Render's free tier includes 750 hours/month (more than a full
# 31-day month = 744 hours), so a single service can stay awake 24/7 all month.

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::Secret APP_URL is not set; skipping keep-warm ping."
            exit 0
          fi
          curl -fsS --retry 2 --retry-delay 5 --retry-all-errors --max-time 25 \
            -H "Cache-Control: no-cache" \
            "${APP_URL%/}/api/v1/health" > /dev/null
          echo "Health check OK."

